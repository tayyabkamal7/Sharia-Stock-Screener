name: Refresh screening data

# Live prices are pulled by the app itself on every visit. This job refreshes the slower-moving data:
# balance sheets, Shariah ratios, analyst price targets, dividends and the list of US-listed securities.
on:
  schedule:
    - cron: "30 22 * * 1-5"  # weekdays after the US close (22:30 UTC)
  workflow_dispatch: {}       # run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build dataset
        env:
          PYTHONUNBUFFERED: "1"
        run: python build_data.py --minutes 210 --workers 3
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh screening data"
          git pull --rebase
          git push
